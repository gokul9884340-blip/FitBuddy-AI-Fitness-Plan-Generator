<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Fitness Plan</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>💪 FitBuddy</h1>
    <p>AI-powered personalized 7-day fitness plans</p>
  </div>

  <div class="card">
    <h2>Create Your Fitness Plan</h2>
    <form method="post" action="/generate">
      <label>Name</label>
      <input name="name" required placeholder="Enter your name">

      <label>Age</label>
      <input type="number" name="age" min="10" max="100" required>

      <label>Weight (kg)</label>
      <input type="number" name="weight" min="20" max="300" step="0.1" required>

      <label>Fitness Goal</label>
      <select name="goal" required>
        <option value="weight loss">Weight Loss</option>
        <option value="muscle gain">Muscle Gain</option>
        <option value="general fitness">General Fitness</option>
      </select>

      <label>Intensity</label>
      <select name="intensity" required>
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Generate My Plan ✨</button>
    </form>
  </div>

  <a class="admin-link" href="/view-all-users">Admin: View All Users</a>
</div>
</body>
</html>
